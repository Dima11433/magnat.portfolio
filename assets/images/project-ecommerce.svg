  <text x="60" y="172" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">Скидки до -35% на аудиосистемы и девайсы</text>
  <circle cx="480" cy="150" r="35" fill="url(#cardGrad1)" opacity="0.8" />
  <text x="480" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">HOT</text>

  <!-- Product cards grid -->
