  </g>

  <g transform="translate(217, 220)">
    <!-- Item 2 -->
    <rect width="165" height="135" rx="10" fill="#181f36" stroke="#293354" stroke-width="1" />
    <rect x="15" y="12" width="135" height="60" rx="6" fill="#0e1322" />
