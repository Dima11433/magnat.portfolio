      <stop offset="0%" stop-color="#0d111e" />
      <stop offset="100%" stop-color="#161c30" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#pBg1)" rx="16" />
  
  <!-- Browser Header bar -->
  <rect width="600" height="40" fill="#111628" rx="16" />
  <rect y="25" width="600" height="15" fill="#111628" />
  <circle cx="25" cy="20" r="5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5" fill="#eab308" />
  <circle cx="59" cy="20" r="5" fill="#22c55e" />
  <rect x="85" y="11" width="340" height="18" rx="6" fill="#1e2642" />
  <text x="100" y="24" fill="#64748b" font-family="monospace" font-size="10">https://cybershop-store.ru</text>

  <!-- Store UI Mockup -->
  <!-- Top bar -->
  <rect x="30" y="60" width="120" height="24" rx="6" fill="url(#cardGrad1)" />
  <text x="40" y="76" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">CyberShop</text>
  <rect x="420" y="60" width="150" height="24" rx="6" fill="#1e2642" />
