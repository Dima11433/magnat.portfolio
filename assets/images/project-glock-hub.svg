<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#101528" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="goldPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#hubBg)" rx="16" />

  <!-- Background decorative grid -->
  <line x1="40" y1="40" x2="560" y2="40" stroke="#1e293b" stroke-dasharray="4 6" opacity="0.4" />
  <line x1="40" y1="340" x2="560" y2="340" stroke="#1e293b" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Glock Projects Watermark -->
  <text x="300" y="130" fill="#ffffff" opacity="0.04" font-family="system-ui, sans-serif" font-size="64" font-weight="900" text-anchor="middle">GLOCK</text>
  <text x="300" y="240" fill="#ffffff" opacity="0.04" font-family="system-ui, sans-serif" font-size="64" font-weight="900" text-anchor="middle">PROJECTS</text>

  <!-- Central Hub Icon & Badge -->
  <g transform="translate(300, 150)" filter="url(#glowEffect)">
    <circle cx="0" cy="0" r="55" fill="#0f172a" stroke="url(#goldPurple)" stroke-width="3" />
    <path d="M-15,-20 L15,0 L-15,20 Z" fill="none" stroke="#06b6d4" stroke-width="3" />
    <text x="0" y="10" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">⚡</text>
  </g>

  <!-- Header Info -->
  <text x="300" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="1">GLOCK PROJECTS</text>
  <text x="300" y="270" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Официальный хаб экосистемы ботов и сервисов</text>

  <!-- Telegram badge -->
  <g transform="translate(210, 300)">
    <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="90" y="23" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">t.me/glock_projects</text>
  </g>
</svg>