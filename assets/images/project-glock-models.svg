<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="shopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141c2b" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <linearGradient id="goldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#shopBg)" rx="16" />

  <!-- Shopping & Digital Bag Icon -->
  <g transform="translate(300, 130)">
    <circle cx="0" cy="0" r="65" fill="#131926" stroke="url(#goldNeon)" stroke-width="3" />
    <text x="0" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="42" text-anchor="middle">💎</text>
  </g>

  <text x="300" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">МОДЕЛИ ШОП</text>
  <text x="300" y="270" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Эксклюзивный каталог, моментальная выдача и авто-оплата</text>

  <g transform="translate(200, 300)">
    <rect width="200" height="36" rx="18" fill="#241b12" stroke="#f59e0b" stroke-width="1.5" />
    <text x="100" y="23" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Каталог товаров • Магазин</text>
  </g>
</svg>