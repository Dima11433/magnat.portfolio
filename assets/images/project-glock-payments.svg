<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="payBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a14" />
      <stop offset="50%" stop-color="#1a1226" />
      <stop offset="100%" stop-color="#0a0710" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#payBg)" rx="16" />

  <!-- Floating Virtual Payment Card -->
  <g transform="translate(190, 60)">
    <rect width="220" height="135" rx="14" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="1" opacity="0.9" />
    <!-- Card Chip -->
    <rect x="25" y="30" width="32" height="24" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
    <text x="195" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="end">GLOCK</text>
    <text x="25" y="90" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">•••• •••• •••• 9412</text>
    <text x="25" y="115" fill="#e2e8f0" font-family="monospace" font-size="10">VALID 12/29</text>
    <text x="195" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">PAYMENTS</text>
  </g>

  <text x="300" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">ВЫДАЧА КАРТ &amp; ПЛАТЕЖИ</text>
  <text x="300" y="270" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Мгновенный выпуск виртуальных карт и автоматизация оплат</text>

  <g transform="translate(195, 300)">
    <rect width="210" height="36" rx="18" fill="#201533" stroke="#a855f7" stroke-width="1.5" />
    <text x="105" y="23" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Автоматическая выдача 24/7</text>
  </g>
</svg>