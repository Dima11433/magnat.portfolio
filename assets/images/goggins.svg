<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gogginsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10" />
      <stop offset="50%" stop-color="#141724" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="24" fill="url(#gogginsBg)" stroke="#262b42" stroke-width="1.5" />
  
  <!-- Subtle decorative grids -->
  <line x1="50" y1="20" x2="550" y2="20" stroke="#334155" stroke-dasharray="4 6" opacity="0.3" />
  <line x1="50" y1="380" x2="550" y2="380" stroke="#334155" stroke-dasharray="4 6" opacity="0.3" />

  <!-- Background Motto -->
  <text x="300" y="110" fill="#ffffff" opacity="0.04" font-family="system-ui, sans-serif" font-size="80" font-weight="900" text-anchor="middle">DISCIPLINE</text>
  <text x="300" y="320" fill="#ffffff" opacity="0.04" font-family="system-ui, sans-serif" font-size="80" font-weight="900" text-anchor="middle">STRENGTH</text>

  <!-- Central Emblem / Warrior Silhouette Frame -->
  <circle cx="300" cy="180" r="105" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" opacity="0.9" />
  <circle cx="300" cy="180" r="115" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="6 8" opacity="0.5" />

  <!-- Silhouette of David Goggins / Athletic Torso -->
  <g transform="translate(180, 75)">
    <!-- Shoulders and muscular neck -->
    <path d="M40,220 C40,165 75,145 120,145 C165,145 200,165 200,220 Z" fill="#1e293b" />
    <path d="M95,145 L120,185 L145,145 Z" fill="#0f172a" />
    <!-- Neck -->
    <rect x="100" y="105" width="40" height="45" rx="6" fill="#475569" />
    <!-- Head bald silhouette -->
    <ellipse cx="120" cy="80" rx="34" ry="42" fill="#64748b" />
    <!-- Sharp facial shadow / jawline -->
    <path d="M96,78 C96,110 110,122 120,122 C130,122 144,110 144,78 Z" fill="#334155" />
    <!-- Determined brow / eyes shadow -->
    <line x1="104" y1="72" x2="116" y2="72" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="124" y1="72" x2="136" y2="72" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Tag / Name Badge -->
  <g transform="translate(190, 310)">
    <rect width="220" height="42" rx="10" fill="#1e2238" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="110" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1.5">ДЭВИД ГОГГИНС</text>
  </g>
  <text x="300" y="372" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Ультрамарафонец • Экс-морской котик США • Автор бестселлеров</text>
</svg>