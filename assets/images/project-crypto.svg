<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b14" />
      <stop offset="100%" stop-color="#12182c" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#crBg)" rx="16" />

  <!-- Browser bar -->
  <rect width="600" height="40" fill="#0e1222" rx="16" />
  <rect y="25" width="600" height="15" fill="#0e1222" />
  <circle cx="25" cy="20" r="5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5" fill="#eab308" />
  <circle cx="59" cy="20" r="5" fill="#22c55e" />
  <text x="85" y="24" fill="#64748b" font-family="monospace" font-size="11">https://finflow-converter.app</text>

  <!-- Currency rates widget -->
  <g transform="translate(40, 60)">
    <rect width="250" height="90" rx="10" fill="#141a30" stroke="#253056" stroke-width="1" />
    <text x="20" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">USD / RUB</text>
    <text x="20" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="900">89.45 ₽</text>
    <text x="180" y="62" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">+0.84% ↑</text>
  </g>

  <g transform="translate(310, 60)">
    <rect width="250" height="90" rx="10" fill="#141a30" stroke="#253056" stroke-width="1" />
    <text x="20" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">BTC / USDT</text>
    <text x="20" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="900">$94,320</text>
    <text x="180" y="62" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">+3.12% ↑</text>
  </g>

  <!-- Interactive Chart Area -->
  <g transform="translate(40, 170)">
    <rect width="520" height="180" rx="12" fill="#11162a" stroke="#202a4a" stroke-width="1" />
    <text x="25" y="30" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Динамика курса за 30 дней</text>
    <text x="430" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">1M • 3M • 1Y</text>

    <!-- Grid lines -->
    <line x1="25" y1="60" x2="495" y2="60" stroke="#1e2746" stroke-width="1" />
    <line x1="25" y1="100" x2="495" y2="100" stroke="#1e2746" stroke-width="1" />
    <line x1="25" y1="140" x2="495" y2="140" stroke="#1e2746" stroke-width="1" />

    <!-- Chart Path -->
    <path d="M30,135 Q90,140 140,110 T240,90 T340,120 T420,60 T490,45" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" />
    
    <circle cx="490" cy="45" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>