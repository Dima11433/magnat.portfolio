<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="garantBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e14" />
      <stop offset="50%" stop-color="#0e1f24" />
      <stop offset="100%" stop-color="#060c10" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#garantBg)" rx="16" />

  <!-- Shield of Security -->
  <g transform="translate(300, 140)">
    <circle cx="0" cy="0" r="70" fill="#091419" stroke="url(#shieldGrad)" stroke-width="3" opacity="0.9" />
    <path d="M-25,-30 L25,-30 L32,5 C32,25 0,42 0,42 C0,42 -32,25 -32,5 Z" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2.5" />
    <text x="0" y="12" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">🛡️</text>
  </g>

  <text x="300" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">БОТ ГАРАНТ</text>
  <text x="300" y="270" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Безопасные P2P сделки и автоматический арбитраж 24/7</text>

  <!-- Trust stats -->
  <g transform="translate(180, 300)">
    <rect width="240" height="36" rx="18" fill="#0d231e" stroke="#10b981" stroke-width="1.5" />
    <text x="120" y="23" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">100% Защита средств • Escrow</text>
  </g>
