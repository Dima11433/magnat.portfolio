<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="saasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="purpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#saasBg)" rx="16" />

  <!-- Browser bar -->
  <rect width="600" height="40" fill="#0f172a" rx="16" />
  <rect y="25" width="600" height="15" fill="#0f172a" />
  <circle cx="25" cy="20" r="5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5" fill="#eab308" />
  <circle cx="59" cy="20" r="5" fill="#22c55e" />
  <text x="85" y="24" fill="#64748b" font-family="monospace" font-size="11">https://metrics-saas-dashboard.io</text>

  <!-- Left Mini Sidebar -->
  <rect x="0" y="40" width="65" height="340" fill="#0c1220" />
  <circle cx="32" cy="68" r="14" fill="url(#purpGrad)" />
  <rect x="18" y="110" width="28" height="6" rx="3" fill="#64748b" />
  <rect x="18" y="135" width="28" height="6" rx="3" fill="#64748b" />
  <rect x="18" y="160" width="28" height="6" rx="3" fill="#64748b" />
  <rect x="18" y="185" width="28" height="6" rx="3" fill="#64748b" />

  <!-- Main Analytics Area -->
  <g transform="translate(85, 60)">
    <!-- KPI 1 -->
    <rect width="145" height="75" rx="8" fill="#162035" stroke="#233252" stroke-width="1" />
    <text x="15" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">TOTAL REVENUE</text>
    <text x="15" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">$48,250</text>
  </g>

  <g transform="translate(245, 60)">
    <!-- KPI 2 -->
    <rect width="145" height="75" rx="8" fill="#162035" stroke="#233252" stroke-width="1" />
    <text x="15" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ACTIVE USERS</text>
    <text x="15" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">12,490</text>
  </g>

  <g transform="translate(405, 60)">
    <!-- KPI 3 -->
    <rect width="145" height="75" rx="8" fill="#162035" stroke="#233252" stroke-width="1" />
    <text x="15" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">CONVERSION</text>
    <text x="15" y="52" fill="#10b981" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">4.82% ↑</text>
  </g>

  <!-- Big Graph Box -->
  <g transform="translate(85, 150)">
    <rect width="465" height="200" rx="10" fill="#151e33" stroke="#22304e" stroke-width="1" />
    <text x="20" y="30" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Динамика активности и трафика</text>

    <!-- Bars chart -->
    <g transform="translate(25, 60)">
      <rect x="0" y="40" width="22" height="75" rx="4" fill="#3b82f6" />
      <rect x="35" y="20" width="22" height="95" rx="4" fill="#8b5cf6" />
      <rect x="70" y="50" width="22" height="65" rx="4" fill="#3b82f6" />
      <rect x="105" y="10" width="22" height="105" rx="4" fill="#8b5cf6" />
      <rect x="140" y="35" width="22" height="80" rx="4" fill="#3b82f6" />
      <rect x="175" y="15" width="22" height="100" rx="4" fill="#8b5cf6" />
      <rect x="210" y="55" width="22" height="60" rx="4" fill="#3b82f6" />
      <rect x="245" y="5" width="22" height="110" rx="4" fill="#8b5cf6" />
      <rect x="280" y="30" width="22" height="85" rx="4" fill="#3b82f6" />
      <rect x="315" y="20" width="22" height="95" rx="4" fill="#8b5cf6" />
      <rect x="350" y="45" width="22" height="70" rx="4" fill="#3b82f6" />
      <rect x="385" y="10" width="22" height="105" rx="4" fill="#10b981" />
    </g>
  </g>
</svg>