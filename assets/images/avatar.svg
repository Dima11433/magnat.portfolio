<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  
  <!-- Subtle glowing circle frames -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="200" cy="200" r="172" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3" />

  <!-- Code elements in background -->
  <text x="35" y="80" fill="#6366f1" opacity="0.4" font-family="monospace" font-size="22" font-weight="bold">&lt;developer&gt;</text>
  <text x="300" y="85" fill="#06b6d4" opacity="0.4" font-family="monospace" font-size="20" font-weight="bold">{ code }</text>
  <text x="35" y="340" fill="#38bdf8" opacity="0.35" font-family="monospace" font-size="18">const dev = true;</text>
  <text x="320" y="335" fill="#a855f7" opacity="0.4" font-family="monospace" font-size="24">=&gt;</text>

  <!-- Developer Silhouette / Character -->
  <g transform="translate(0, 15)">
    <!-- Shoulders / Hoodie -->
    <path d="M100,385 C100,295 142,255 200,255 C258,255 300,295 300,385 Z" fill="url(#hoodieGrad)" stroke="#475569" stroke-width="2" />
    <path d="M175,255 L200,305 L225,255 Z" fill="#090d16" />
    <line x1="185" y1="285" x2="185" y2="330" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="215" y1="285" x2="215" y2="330" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Neck & Head -->
    <rect x="182" y="205" width="36" height="55" rx="8" fill="#fed7aa" />
    <ellipse cx="200" cy="175" rx="44" ry="52" fill="#fed7aa" />

    <!-- Haircut -->
    <path d="M154,165 C153,115 180,105 205,105 C235,105 248,120 246,165 C240,138 225,126 200,126 C175,126 158,142 154,165 Z" fill="#1e293b" />
    <path d="M165,135 C175,115 210,115 235,128 C220,122 185,122 172,142 Z" fill="#334155" />

    <!-- Smart Glasses with Neon Reflexes -->
    <g>
      <rect x="165" y="158" width="30" height="22" rx="6" fill="#090d16" stroke="url(#accentGrad)" stroke-width="2.5" />
      <rect x="205" y="158" width="30" height="22" rx="6" fill="#090d16" stroke="url(#accentGrad)" stroke-width="2.5" />
      <line x1="195" y1="166" x2="205" y2="166" stroke="url(#accentGrad)" stroke-width="2.5" />
      <path d="M170,161 L182,161 L172,176 L166,176 Z" fill="#38bdf8" opacity="0.8" />
      <path d="M210,161 L222,161 L212,176 L206,176 Z" fill="#38bdf8" opacity="0.8" />
    </g>

    <!-- Headphones -->
    <path d="M148,150 C142,150 138,162 138,178 C138,194 142,200 150,198" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
    <path d="M252,150 C258,150 262,162 262,178 C262,194 258,200 250,198" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
    <path d="M148,152 C150,90 250,90 252,152" fill="none" stroke="#6366f1" stroke-width="4.5" opacity="0.8" />

    <!-- Friendly smile -->
    <path d="M192,204 Q200,210 208,204" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Glowing Status Badge -->
  <g transform="translate(250, 305)" filter="url(#neonGlow)">
    <rect width="124" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <circle cx="22" cy="18" r="5.5" fill="#10b981" />
    <text x="36" y="23" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Open to work</text>
  </g>
</svg>