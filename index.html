<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0905">
  <title>Atelier Unit — Craftwork, Technology, Design</title>
  <style>
    @font-face {
      font-family: "AU Grotesk";
      src: url(assets/au-grotesk-regular.woff2) format("woff2");
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: "AU Grotesk";
      src: url(assets/au-grotesk-bold.woff2) format("woff2");
      font-weight: 700;
      font-display: block;
    }

    :root {
      --vh: 1vh;
      --ink: #ffffff;
      --base-bot: #130e09;
      --rule: rgba(255,255,255,0.115);
      --grid: rgba(255,255,255,0.0265);
      --menu-bg: #fcfcfc;
      --menu-ink: #141414;
      --small-min: 10px;
      --u: min(100vw / 1280, var(--vh) * 100 / 800);
      --small: max(var(--small-min), 12.6 * var(--u));
      --e-expo: cubic-bezier(.16, 1, .3, 1);
      --e-quint: cubic-bezier(.22, 1, .36, 1);
      --e-sweep: cubic-bezier(.76, 0, .24, 1);
    }
    @supports (height: 1dvh) {
      :root {
        --vh: 1dvh;
      }
    }
    @media (min-height: 480px) {
      :root {
        --small-min: 11.28px;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #130e09;
      color: #ffffff;
      font-family: "AU Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      font-kerning: normal;
    }

    a, button {
      color: inherit;
      font-family: inherit;
    }
    a {
      text-decoration: none;
    }
    button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    :focus-visible {
      outline: 1px solid white;
      outline-offset: 3px;
    }

    /* Stage */
    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 320px;
      background: linear-gradient(180deg, #0d0905 0%, #0f0a05 15%, #0d0a05 30%, #0d0905 45%, #0e0a06 60%, #0f0c07 75%, #130e08 90%, #130e09 100%);
    }

    /* Background video */
    .hero__photo {
      position: absolute;
      z-index: -3;
      --pw: max(min(100vw, 1536 * var(--u)), var(--vh) * 160);
      --fade: clamp(0px, 100vw - var(--pw), var(--pw) * .08);
      top: var(--photo-top, 0px);
      left: calc((100vw - var(--pw)) * 0.5293);
      width: var(--pw);
      aspect-ratio: 16 / 10;
      mask-image: linear-gradient(to right, transparent, black var(--fade), black calc(100% - var(--fade)), transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black var(--fade), black calc(100% - var(--fade)), transparent);
    }
    .hero__photo video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    /* Grid */
    .grid {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      display: flex;
      mask-image: radial-gradient(ellipse 62% 95% at 50% 62%, rgba(0,0,0,0.83) 0%, #000 100%);
      -webkit-mask-image: radial-gradient(ellipse 62% 95% at 50% 62%, rgba(0,0,0,0.83) 0%, #000 100%);
    }
    .grid i {
      flex: 1 1 0;
      height: 100%;
      position: relative;
    }
    .grid i::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(75% - 0.5px);
      width: 2px;
      background: var(--grid);
    }

    /* Top bar */
    .logo {
      position: absolute;
      left: calc(20.65 * var(--u));
      top: calc(12.8 * var(--u));
      width: max(calc(142.60 * var(--u)), 96px);
      display: block;
    }
    .logo svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .small {
      font-size: var(--small);
      line-height: 1;
      font-weight: 400;
      margin: 0;
      -webkit-text-stroke: 0.022em currentColor;
    }

    .tagline {
      position: absolute;
      left: calc(100% * 386.5 / 1280);
      top: calc(12.6 * var(--u));
      display: flex;
      flex-direction: column;
    }
    .tagline span {
      display: block;
      letter-spacing: var(--ls, -0.051em);
    }

    .contact {
      position: absolute;
      left: calc(100% * 798.5 / 1280);
      top: calc(12.5 * var(--u));
      font-style: normal;
      display: flex;
      flex-direction: column;
    }
    .contact a, .contact span {
      display: block;
      letter-spacing: var(--ls, -0.051em);
    }

    .actions {
      position: absolute;
      right: calc(32 * var(--u));
      top: calc(13 * var(--u));
      display: flex;
      align-items: center;
      gap: 1.22em;
      font-size: var(--small);
      -webkit-text-stroke: 0.022em currentColor;
    }
    .actions .lang {
      letter-spacing: -0.064em;
      line-height: 1;
      transform: translate(0em, 0.139em);
      -webkit-text-stroke-width: 0.01em;
    }
    .actions .menu {
      letter-spacing: -0.055em;
      width: 6.349em;
      height: 1.508em;
      background: #fcfcfc;
      color: #141414;
      text-align: left;
      padding-left: 0.33em;
      line-height: 1.508em;
      transition: background-color 0.15s;
    }
    .actions .menu span {
      display: inline-block;
      transform: translateY(0);
    }
    @media (hover: hover) {
      .actions .menu:hover {
        background: #ffffff;
      }
    }

    /* Services and rule */
    .services {
      list-style: none;
      position: absolute;
      width: 100%;
      top: calc(211.75 * var(--u));
      font-size: max(calc(var(--small-min) * 1.06), calc(13.3 * var(--u)));
      line-height: 1;
      margin: 0;
      padding: 0;
    }
    .services li {
      position: absolute;
      white-space: nowrap;
      -webkit-text-stroke-width: 0.008em;
      letter-spacing: var(--ls, -0.051em);
      clip-path: inset(-0.25em -0.4em -0.35em -0.4em);
    }
    .services .rv {
      display: inline-block;
      will-change: translate, transform;
    }

    .rule {
      position: absolute;
      width: 100%;
      left: 0;
      top: calc(239 * var(--u));
      height: 1px;
      background: var(--rule);
      z-index: -1;
      box-shadow: 0 -1px 0 rgba(255,255,255,.038), 0 1px 0 rgba(255,255,255,.014);
      transform-origin: 0 50%;
      will-change: transform;
    }

    /* Headline */
    .hl {
      position: absolute;
      left: 50%;
      bottom: 0.49140em;
      margin: 0;
      width: 0;
      height: 0;
      font-size: calc(170.94 * var(--u));
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .hl__line {
      position: absolute;
      left: 0;
      bottom: var(--b);
    }
    .hl__clip {
      display: block;
      clip-path: inset(-0.8em -3.6em -0.05em -3.6em);
    }
    .hl__track {
      display: block;
      position: relative;
      will-change: translate, transform;
    }
    .hl__track span {
      position: absolute;
      left: var(--x);
      top: -0.909em;
      transform-origin: 0 0;
      transform: translateY(calc(0.909em + var(--dy, 0em))) scale(var(--sx), var(--sy)) translateY(-0.909em) translateY(0.5445em) scaleY(var(--k, 1)) translateY(-0.5445em);
    }

    /* Entrance animations */
    @keyframes au-rise {
      from { translate: 0 var(--rise); }
      to { translate: 0 0; }
    }
    @keyframes au-soft {
      from { translate: 0 var(--rise); opacity: 0; }
      to { translate: 0 0; opacity: 1; }
    }
    @keyframes au-draw {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes au-wipe {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }
    @keyframes au-on {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    html.is-entering {
      --au-state: paused;
    }
    html.is-entering.is-playing {
      --au-state: running;
    }

    html.is-entering .rule {
      animation: au-draw 0.85s var(--e-sweep) 0.24s var(--au-state) both;
    }
    html.is-entering .hl__line:nth-child(1) .hl__track {
      --rise: 1em;
      animation: au-rise 1.05s var(--e-expo) 0.10s var(--au-state) both;
    }
    html.is-entering .hl__line:nth-child(2) .hl__track {
      --rise: 1em;
      animation: au-rise 1.05s var(--e-expo) 0.18s var(--au-state) both;
    }
    html.is-entering .hl__line:nth-child(3) .hl__track {
      --rise: 1em;
      animation: au-rise 1.05s var(--e-expo) 0.26s var(--au-state) both;
    }
    html.is-entering .services li:nth-child(1) .rv {
      --rise: calc(100% + 0.6em);
      animation: au-rise 0.8s var(--e-quint) 0.56s var(--au-state) both;
    }
    html.is-entering .services li:nth-child(2) .rv {
      --rise: calc(100% + 0.6em);
      animation: au-rise 0.8s var(--e-quint) 0.62s var(--au-state) both;
    }
    html.is-entering .services li:nth-child(3) .rv {
      --rise: calc(100% + 0.6em);
      animation: au-rise 0.8s var(--e-quint) 0.68s var(--au-state) both;
    }
    html.is-entering .logo rect:nth-child(1) { animation: au-on 0.14s ease-out 0.700s var(--au-state) both; }
    html.is-entering .logo rect:nth-child(2) { animation: au-on 0.14s ease-out 0.735s var(--au-state) both; }
    html.is-entering .logo rect:nth-child(3) { animation: au-on 0.14s ease-out 0.840s var(--au-state) both; }
    html.is-entering .logo rect:nth-child(4) { animation: au-on 0.14s ease-out 0.910s var(--au-state) both; }
    html.is-entering .logo rect:nth-child(5) { animation: au-on 0.14s ease-out 0.805s var(--au-state) both; }
    html.is-entering .logo rect:nth-child(6) { animation: au-on 0.14s ease-out 0.945s var(--au-state) both; }
    html.is-entering .logo rect:nth-child(7) { animation: au-on 0.14s ease-out 0.700s var(--au-state) both; }

    html.is-entering .tagline span:nth-child(1) {
      --rise: 0.55em;
      animation: au-soft 0.75s var(--e-quint) 0.78s var(--au-state) both;
    }
    html.is-entering .tagline span:nth-child(2) {
      --rise: 0.55em;
      animation: au-soft 0.75s var(--e-quint) 0.83s var(--au-state) both;
    }
    html.is-entering .tagline span:nth-child(3) {
      --rise: 0.55em;
      animation: au-soft 0.75s var(--e-quint) 0.88s var(--au-state) both;
    }
    html.is-entering .contact a {
      --rise: 0.55em;
      animation: au-soft 0.75s var(--e-quint) 0.88s var(--au-state) both;
    }
    html.is-entering .contact span {
      --rise: 0.55em;
      animation: au-soft 0.75s var(--e-quint) 0.93s var(--au-state) both;
    }
    html.is-entering .actions .lang {
      --rise: 0.55em;
      animation: au-soft 0.6s var(--e-quint) 0.98s var(--au-state) both;
    }
    html.is-entering .actions .menu {
      animation: au-wipe 0.6s cubic-bezier(.25, 1, .5, 1) 1.02s var(--au-state) both;
    }

    /* Responsive */
    @media (max-aspect-ratio: 114/100) {
      :root {
        --small-min: 12px;
        --m: clamp(16px, 3.2vw, 32px);
        --bar-top: calc(var(--m) * .64);
        --pw: calc(var(--vh) * 138.6);
        --photo-top: calc(var(--vh) * 15);
      }
      .logo {
        left: var(--m);
        top: var(--bar-top);
      }
      .tagline {
        top: var(--bar-top);
      }
      .contact {
        top: var(--bar-top);
      }
      .actions {
        right: var(--m);
        top: var(--bar-top);
      }
      .hero__photo {
        top: var(--photo-top);
        mask-image: linear-gradient(to bottom, transparent 0, #000 11%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 11%);
      }
      .services {
        top: calc(var(--vh) * 44);
      }
      .services li:nth-child(1) {
        left: var(--m) !important;
      }
      .services li:nth-child(2) {
        left: 50% !important;
        transform: translateX(-50%) !important;
      }
      .services li:nth-child(3) {
        right: var(--m) !important;
      }
      .rule {
        top: calc(var(--vh) * 44 + 2.1em);
        font-size: var(--small);
      }
      .hl {
        font-size: calc((100vw - 2 * var(--m)) / 6.3063);
        bottom: max(0.49140em, calc(18px + env(safe-area-inset-bottom, 0px)));
      }
    }

    @media (max-aspect-ratio: 114/100) and (max-width: 679px) {
      :root {
        --small-min: 11.5px;
        --bar-top: calc(var(--m) * .64 + env(safe-area-inset-top, 0px));
      }
      .logo {
        width: 104px;
      }
      .actions {
        gap: 14px;
      }
      .tagline {
        left: var(--m);
        top: calc(70px + env(safe-area-inset-top, 0px));
      }
      .tagline span {
        display: block;
      }
      .contact {
        left: auto;
        right: var(--m);
        top: calc(70px + env(safe-area-inset-top, 0px));
        text-align: right;
      }
    }

    @media (max-aspect-ratio: 114/100) and (max-width: 309px) {
      .contact {
        top: calc(70px + 3em + 12px + env(safe-area-inset-top, 0px));
      }
      .services li {
        width: min-content;
        white-space: normal;
      }
      .services li:nth-child(2) {
        text-align: center;
      }
      .services li:nth-child(3) {
        text-align: right;
      }
      :root {
        --F: calc((100vw - 2 * var(--m)) / 6.3063);
        --hl-bot: max(0.49140em, calc(18px + env(safe-area-inset-bottom, 0px)));
        --ptop: max(calc(var(--vh) * 15), min(calc(150px + env(safe-area-inset-top, 0px)), calc(var(--vh) * 71 - var(--hl-bot) - 2.30 * var(--F) - 56px)));
        --photo-top: var(--ptop);
      }
      .services {
        top: calc(var(--ptop) + var(--vh) * 29);
      }
      .rule {
        top: calc(var(--ptop) + var(--vh) * 29 + 3.1em);
      }
    }

    @media (max-height: 479px) and (min-aspect-ratio: 1141/1000) {
      :root {
        --small-min: 11.5px;
        --mL: max(16px, env(safe-area-inset-left, 0px));
        --mR: max(16px, env(safe-area-inset-right, 0px));
        --bar-top: calc(16px * .64);
      }
      .logo {
        left: var(--mL);
        top: var(--bar-top);
      }
      .tagline {
        left: calc(var(--mL) + 96px + 2em);
        top: var(--bar-top);
      }
      .contact {
        left: auto;
        right: calc(var(--mR) + 8.83em + 2em);
        top: var(--bar-top);
      }
      .actions {
        right: var(--mR);
        top: var(--bar-top);
      }
      .services li:nth-child(1) {
        left: var(--mL) !important;
      }
      .services li:nth-child(2) {
        left: calc(var(--mL) + (100% - var(--mL) - var(--mR)) / 2) !important;
        transform: translateX(-50%) !important;
      }
      .services li:nth-child(3) {
        right: var(--mR) !important;
      }
      .hl {
        left: calc(var(--mL) + (100% - var(--mL) - var(--mR)) / 2);
        bottom: max(0.49140em, calc(8px + env(safe-area-inset-bottom, 0px)));
      }
    }

    @media (max-height: 479px) and (min-aspect-ratio: 1141/1000) and (max-width: 559px) {
      .contact {
        left: auto;
        right: var(--mR);
        top: calc(var(--bar-top) + 2.6em);
        text-align: right;
      }
    }

    @media (pointer: coarse) {
      .lang, .menu, .logo, .contact a {
        position: relative;
      }
      .lang::after, .menu::after, .logo::after, .contact a::after {
        content: "";
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        min-height: 44px;
      }
      .lang::after {
        left: -12px;
        right: -0.61em;
      }
      .menu::after {
        left: -0.61em;
        right: -10px;
      }
      .logo::after {
        left: -10px;
        right: -10px;
        width: calc(100% + 20px);
      }
      .contact a::after {
        left: -6px;
        right: -6px;
        height: max(100%, 32px);
        min-height: 44px;
      }
    }
  </style>
</head>

      <span class="hl__line" aria-hidden="true" style="--b: 1.56780em; --dy: -0.00275em; --sy: 1.0063;">

            <span style="--x: 1.01367em; --sx: 0.9833; --k: 1.0055;">O</span>
            <span style="--x: 1.69181em; --sx: 1.0093;">R</span>

      <span class="hl__line" aria-hidden="true" style="--b: 0.78390em; --dy: 0.00059em; --sy: 0.9950;">

  <script>
    (function () {
      var doc = document.documentElement;
      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced) {
        var video = document.querySelector('.hero__photo video');
        if (video) {
          video.removeAttribute('autoplay');
          video.pause();
        }
        return;
      }

      doc.classList.add('is-entering');
      var failsafe = setTimeout(cleanup, 4500);

      function cleanup() {
        clearTimeout(failsafe);
        doc.classList.remove('is-entering', 'is-playing');
      }

      function startPlayback() {
        requestAnimationFrame(function () {
          doc.classList.add('is-playing');
          var endTimeout = setTimeout(cleanup, 2200);
          var animTargets = document.querySelectorAll(
            '.rule, .hl__track, .services .rv, .logo rect, .tagline span, .contact a, .contact span, .actions .lang, .actions .menu'
          );
          var pending = 0;
          animTargets.forEach(function (el) {
            var anims = el.getAnimations ? el.getAnimations() : [];
            anims.forEach(function (anim) {
              var name = anim.animationName || '';
              if (name.indexOf('au-') === 0) {
                pending++;
                anim.finished.then(function () {
                  pending--;
                  if (pending <= 0) {
                    clearTimeout(endTimeout);
                    cleanup();
                  }
                }).catch(function () {});
              }
            });
          });
        });
      }

      var fontTimeout = setTimeout(startPlayback, 1200);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          clearTimeout(fontTimeout);
          startPlayback();
        });
      }
    })();
  </script>
